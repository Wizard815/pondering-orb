# Pondering Orb stack. Build the image with `docker compose build` (or use a
# published image), copy config/orb.example.yaml to config/orb.yaml, and put
# secrets in .env.
#
# This file starts Orb and a read-only proxy for the Docker socket. Nothing
# else. Apps you already run (Hermes Studio, Argos, LLMWIKI, UpstreamManager,
# your CalDAV server, Uptime Kuma) stay where they are; Orb only connects to
# them by address, set below or in Settings -> Connections.
#
# No Uptime Kuma yet? Start the bundled one with:
#   docker compose --profile uptime up -d
# Already have one? Leave the profile off and point UPTIME_URL at yours.

services:
  orb:
    build: .
    image: pondering-orb:local
    container_name: pondering-orb
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      ORB_CONFIG: /config/orb.yaml
      ORB_PASSWORD: ${ORB_PASSWORD}                  # sign-in for the web app
      ORB_API_TOKENS: ${ORB_API_TOKENS:-}            # "hermes:<token>,claude:<token>" for agents and /mcp
      # Addresses of apps you already run (container name on a shared
      # network, or a LAN address for another machine):
      UPTIME_URL: http://uptime-kuma:3001
      UPSTREAM_URL: http://192.168.20.10:5000        # placeholder: the computer running UpstreamManager
      HERMES_URL: http://hermes-studio:6060
      ARGOS_URL: http://argos:8080
      WIKI_URL: http://llmwiki:27123
      ORB_PROC: /host/proc
      DOCKER_HOST: tcp://docker-proxy:2375
      WIKI_API_KEY: ${WIKI_API_KEY}
      CALDAV_USER: ${CALDAV_USER}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      HERMES_USER: ${HERMES_USER}
      HERMES_PASSWORD: ${HERMES_PASSWORD}
    volumes:
      - ./config:/config
      - ./data:/data                                 # orb.db (SQLite); the container runs as uid 1000
      - /proc:/host/proc:ro                          # System tab: cores, memory, network
      # set ORB_PROC=/host/proc (or system.proc in orb.yaml) to read the host, not the container
      - /mnt/user/appdata/llmwiki/vault:/vault:ro    # Wiki tab reads the whole vault; writes go through the REST API
    networks: [edge, ai_net, orb]                  # ai_net reaches Hermes, Argos and llmwiki
    depends_on: [docker-proxy]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    profiles: [uptime]                               # only with --profile uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma:/app/data
    networks: [orb]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest      # pin a version you have tested
    container_name: orb-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [orb]

networks:
  orb: {}
  edge:
    external: true
    name: proxynat
  ai_net:
    external: true
    name: ai_net
