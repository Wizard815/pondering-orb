# Pondering Orb. One person per Orb: for someone else, run a second copy
# with its own folder, .env and port.
#
#   cp docker-compose.example.yml docker-compose.yml
#   cp .env.example .env                  # time zone, password, keys, addresses
#   cp config/orb.example.yaml config/orb.yaml
#   mkdir -p data && sudo chown 1000:1000 data
#   docker compose up -d                  # pulls the image (or: docker compose up -d --build)
#
# This starts Orb and a read-only proxy for the Docker socket, nothing else.
# Apps you already run (Hermes Studio, Argos, LLMWIKI, UpstreamManager, the
# ALLGlance gateway, Firefly III, Coinpile, Omi, Uptime Kuma) stay where they are; Orb
# connects to them by address (.env, config/orb.yaml or Settings -> Connections).
#
# Optional extras:
#   docker compose --profile uptime up -d   # a bundled Uptime Kuma (set UPTIME_URL=http://uptime-kuma:3001)
#   docker compose --profile btop up -d     # real btop as a web terminal for the System tab

services:
  orb:
    image: ghcr.io/wizard815/pondering-orb:latest  # published from main; or build it here:
    build: .
    container_name: pondering-orb
    restart: unless-stopped
    init: true
    ports:
      - "${ORB_PORT:-8095}:8095"
    environment:
      ORB_CONFIG: /config/orb.yaml
      TZ: ${TZ:-UTC}                                 # your time zone: what "today" means for logs, chores, bills, the brief
      ORB_HOSTNAME: ${ORB_HOSTNAME:-}                # the name the System tab shows for this host
      ORB_PASSWORD: ${ORB_PASSWORD:?set ORB_PASSWORD in .env}  # sign-in for the web app
      ORB_API_TOKENS: ${ORB_API_TOKENS:-}            # "hermes:<token>,claude:<token>" for agents and /mcp
      # Addresses of apps you already run. Empty = not used. A container name
      # works on a shared network; a LAN address (http://<host>:port) for
      # another machine or compose project. orb.yaml wins when it sets one.
      UNRAID_URL: ${UNRAID_URL:-}                    # Unraid Management Agent (port 8043): containers for the Links page
      UNRAID_LINK_HOST: ${UNRAID_LINK_HOST:-}
      ALLGLANCE_URL: ${ALLGLANCE_URL:-}              # the gateway; also serves vikunja's CalDAV at /dav
      UPSTREAM_URL: ${UPSTREAM_URL:-}
      UPTIME_URL: ${UPTIME_URL:-}
      HERMES_URL: ${HERMES_URL:-}
      HERMES_PUBLIC_URL: ${HERMES_PUBLIC_URL:-}      # Studio in your browser (Agents tab links); defaults to HERMES_URL
      ARGOS_URL: ${ARGOS_URL:-}                      # Golem's local model (OpenAI-compatible /v1)
      WIKI_URL: ${WIKI_URL:-}                        # LLMWIKI's Obsidian Local REST API
      ORB_PROC: /host/proc
      DOCKER_HOST: tcp://docker-proxy:2375
      # Logins and keys (the names are what orb.yaml and Settings point at):
      UNRAID_TOKEN: ${UNRAID_TOKEN:-}
      ALLGLANCE_TOKEN: ${ALLGLANCE_TOKEN:-}
      CALDAV_USER: ${CALDAV_USER:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      WIKI_API_KEY: ${WIKI_API_KEY:-}
      HERMES_USER: ${HERMES_USER:-}
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      DECIDER_KEY: ${DECIDER_KEY:-}
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}
      FIREFLY_TOKEN: ${FIREFLY_TOKEN:-}
      COINPILE_TOKEN: ${COINPILE_TOKEN:-}
      OMI_DEV_KEY: ${OMI_DEV_KEY:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
    volumes:
      - ./config:/config
      - ./data:/data                                 # orb.db (SQLite); the container runs as uid 1000
      - /proc:/host/proc:ro                          # System tab: the host's cores, memory, uptime
      - ${LLMWIKI_VAULT:-./vault}:/vault:ro          # the Wiki tab reads the vault; writes go through the REST API
    networks: [orb, dockerapi]
    # To reach apps by container name, join their networks too, e.g.
    #   networks: [orb, dockerapi, ai_net, proxynat]
    # and declare them under networks: below as external.
    depends_on: [docker-proxy]

  docker-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0      # read only: containers and info, no writes
    container_name: orb-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
      DISABLE_IPV6: 1                                # it exits on hosts with IPv6 off (common on Unraid) otherwise
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerapi]                            # only Orb can reach it

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    profiles: [uptime]
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./uptime-kuma:/app/data
    networks: [orb]

  btop:
    build: ./docker/btop
    container_name: orb-btop
    profiles: [btop]
    restart: unless-stopped
    pid: host                                        # see the host's processes, not just this container's
    environment:
      # Optional sign-in ("user:password"). Without it anyone on your LAN can
      # watch btop, which shows every host process's command line.
      BTOP_AUTH: ${BTOP_AUTH:-}
      TZ: ${TZ:-UTC}
    ports:
      - "7681:7681"                                  # "<LAN-IP>:7681:7681" keeps it off other interfaces

networks:
  orb: {}
  dockerapi:
    internal: true
  # Networks your other apps live on, if Orb should reach them by name:
  # ai_net:
  #   external: true
  # proxynat:
  #   external: true
