# Pondering Orb stack. Build the image with `docker compose build` (or use a
# published image), copy config/orb.example.yaml to config/orb.yaml, and put
# secrets in .env (copy .env.example; it also sets TZ, your time zone).
#
# This file starts Orb and a read-only proxy for the Docker socket. Nothing
# else. Apps you already run (Hermes Studio, Argos, LLMWIKI, UpstreamManager,
# your CalDAV server, Uptime Kuma) stay where they are; Orb only connects to
# them by address, set below or in Settings -> Connections.
#
# No Uptime Kuma yet? Start the bundled one with:
#   docker compose --profile uptime up -d
# Already have one? Leave the profile off and point UPTIME_URL at yours.

services:
  orb:
    build: .
    image: pondering-orb:local
    container_name: pondering-orb
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      ORB_CONFIG: /config/orb.yaml
      TZ: ${TZ:-UTC}                                 # your time zone, from .env: what "today" means for logs, chores, the wiki log
      ORB_PASSWORD: ${ORB_PASSWORD:?set ORB_PASSWORD in .env}  # sign-in for the web app; Orb is reachable through the tunnel
      ORB_API_TOKENS: ${ORB_API_TOKENS:-}            # "hermes:<token>,claude:<token>" for agents and /mcp
      # Addresses of apps you already run (container name on a shared
      # network, or a LAN address for another machine):
      UPTIME_URL: http://uptime-kuma:3001
      UPSTREAM_URL: ${UPSTREAM_URL:-}                # e.g. http://192.168.1.20:5000, the computer running UpstreamManager
      HERMES_URL: http://hermes-studio:6060
      HERMES_PUBLIC_URL: ${HERMES_PUBLIC_URL:-}         # Studio in your browser (Agents tab links); defaults to HERMES_URL
      ARGOS_URL: http://argos:8080
      WIKI_URL: http://llmwiki:27123
      ALLGLANCE_URL: ${ALLGLANCE_URL:-}              # e.g. http://allglance-gateway:8090 once you run it
      ALLGLANCE_TOKEN: ${ALLGLANCE_TOKEN:-}
      ORB_PROC: /host/proc
      DOCKER_HOST: tcp://docker-proxy:2375
      WIKI_API_KEY: ${WIKI_API_KEY:-}
      CALDAV_USER: ${CALDAV_USER:-}
      CALDAV_PASSWORD: ${CALDAV_PASSWORD:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PLEX_TOKEN: ${PLEX_TOKEN:-}                    # live panels: named by key_env in the apps YAML
      SABNZBD_API_KEY: ${SABNZBD_API_KEY:-}
      GOBLIN_ORB_KEY: ${GOBLIN_ORB_KEY:-}            # read only: Goblin-Bank's summary (docs/companions.md)
      OMI_DEV_KEY: ${OMI_DEV_KEY:-}                  # read only: omi-local's developer API
      TIINGO_API_KEY: ${TIINGO_API_KEY:-}            # optional: stock prices (free key)
      DECIDER_KEY: ${DECIDER_KEY:-}                  # optional: key for your self-hosted decision model
      HERMES_USER: ${HERMES_USER:-}
      HERMES_PASSWORD: ${HERMES_PASSWORD:-}
    volumes:
      - ./config:/config
      - ./data:/data                                 # orb.db (SQLite); the container runs as uid 1000
      - /proc:/host/proc:ro                          # System tab: cores, memory, network
      # set ORB_PROC=/host/proc (or system.proc in orb.yaml) to read the host, not the container
      - /mnt/user/appdata/llmwiki/vault:/vault:ro    # CHANGE to your vault folder. Wiki tab reads it; writes go through the REST API
    networks: [edge, ai_net, orb, dockerapi]       # ai_net reaches Hermes, Argos and llmwiki
    depends_on: [docker-proxy]

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma
    profiles: [uptime]                               # only with --profile uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./uptime-kuma:/app/data
    networks: [orb]

  # Optional: real btop as a web terminal for the System tab.
  #   docker compose --profile btop up -d
  # then set Settings → btop terminal to http://<host>:7681
  btop:
    build: ./docker/btop
    container_name: orb-btop
    profiles: [btop]
    restart: unless-stopped
    pid: host                                        # see the host's processes, not just this container's
    environment:
      # Optional sign-in for the terminal ("user:password"). Without it anyone
      # on your LAN can watch btop, which shows every host process's command
      # line. Your browser asks for it once inside the System tab.
      BTOP_AUTH: ${BTOP_AUTH:-}
      TZ: ${TZ:-UTC}
    ports:
      - "7681:7681"                                  # use "<LAN-IP>:7681:7681" to keep it off other interfaces

  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest      # pin a version you have tested
    container_name: orb-docker-proxy
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      INFO: 1
      POST: 0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [dockerapi]                            # only Orb can reach it

# edge and ai_net must already exist (docker network create proxynat / ai_net),
# or remove them from orb's networks list above.
networks:
  orb: {}
  dockerapi:
    internal: true
  edge:
    external: true
    name: proxynat
  ai_net:
    external: true
    name: ai_net
