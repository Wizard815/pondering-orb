<title>Pondering Orb</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
<style>
/* Layout: a wizard's tower. The orb and the floor plaques (tabs) sit on a sticky header; each tab is one room, laid out as a grid of stone panels. Dark-first night tower, parchment by day. */
:root{
  --bg:#0f1119; --panel:#161a28; --inset:#1d2133; --line:#2d3352; --line-hi:#4a4568;
  --ink:#ebe3cf; --muted:#9d99ad; --gold:#d9a94f; --gold-soft:#3a2f1b;
  --arcane:#7ccac2; --arcane-soft:#183236; --star:rgba(235,227,207,.55);
  --ok:#7cc48f; --warn:#e2b553; --bad:#e8796c; --ok-bg:#1a3123; --warn-bg:#3a301b; --bad-bg:#3e2121;
  --orb-hi:#e8fffb; --orb-mid:#5fb6ad; --orb-deep:#141c3a;
  --f-display:"Cinzel","Trajan Pro",Georgia,serif;
  --f-body:"Alegreya Sans","Gill Sans",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#ebe2cd; --panel:#f6efdf; --inset:#ede3cc; --line:#cfbf9c; --line-hi:#b39c6e;
  --ink:#2a2217; --muted:#6d604b; --gold:#8b5b12; --gold-soft:#efdbb1;
  --arcane:#1f6d67; --arcane-soft:#d3e7e1; --star:rgba(0,0,0,0);
  --ok:#2e7a4c; --warn:#9a6a0c; --bad:#b03a2d; --ok-bg:#dcecdf; --warn-bg:#f3e4c3; --bad-bg:#f4dbd5;
  --orb-hi:#ffffff; --orb-mid:#4aa39a; --orb-deep:#1d3159; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#ebe2cd; --panel:#f6efdf; --inset:#ede3cc; --line:#cfbf9c; --line-hi:#b39c6e;
  --ink:#2a2217; --muted:#6d604b; --gold:#8b5b12; --gold-soft:#efdbb1;
  --arcane:#1f6d67; --arcane-soft:#d3e7e1; --star:rgba(0,0,0,0);
  --ok:#2e7a4c; --warn:#9a6a0c; --bad:#b03a2d; --ok-bg:#dcecdf; --warn-bg:#f3e4c3; --bad-bg:#f4dbd5;
  --orb-hi:#ffffff; --orb-mid:#4aa39a; --orb-deep:#1d3159; color-scheme:light}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);min-height:100%;
  background-image:radial-gradient(1px 1px at 12% 18%,var(--star),transparent),radial-gradient(1px 1px at 78% 9%,var(--star),transparent),radial-gradient(1.5px 1.5px at 46% 31%,var(--star),transparent),radial-gradient(1px 1px at 88% 52%,var(--star),transparent),radial-gradient(1px 1px at 23% 71%,var(--star),transparent),radial-gradient(1px 1px at 63% 84%,var(--star),transparent);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:.85rem}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--arcane)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding-block:12px 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:10px}
.brand-row{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.orb-wrap{width:54px;height:54px;flex:none;position:relative}
.orb-wrap canvas{width:54px;height:54px;border-radius:50%;display:block;box-shadow:0 0 0 1px var(--line-hi),0 0 24px -4px var(--orb-mid)}
.orb-wrap::after{content:"";position:absolute;left:8px;right:8px;bottom:-6px;height:7px;border-radius:0 0 8px 8px;background:var(--gold);opacity:.75}
h1{font-size:1.75rem;letter-spacing:.06em;line-height:1}
.brand .sub{font-size:.85rem;color:var(--muted);font-style:italic}
.summary{display:flex;flex-wrap:wrap;gap:6px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:500;background:var(--inset);border:1px solid var(--line);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.pill.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.pill.warn{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.pill.bad{color:var(--bad);background:var(--bad-bg);border-color:transparent}
.pill.info{color:var(--arcane);background:var(--arcane-soft);border-color:transparent}

nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin;margin-bottom:-1px}
nav.tabs a{flex:none;text-decoration:none;color:var(--muted);font-family:var(--f-display);font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;border:1px solid transparent;border-bottom:0;border-radius:6px 6px 0 0}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a[aria-current="page"]{color:var(--gold);background:var(--panel);border-color:var(--line)}

main{max-width:1240px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.room{display:flex;flex-direction:column;gap:16px}
.room-head{display:flex;align-items:flex-end;justify-content:space-between;gap:10px 16px;flex-wrap:wrap}
.room-head h2{font-size:1.4rem;letter-spacing:.05em}
.room-head .flavor{font-style:italic;color:var(--muted);font-size:.92rem}
.room-head .titles{display:flex;flex-direction:column;gap:2px}

.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));align-items:start}
.two{display:grid;gap:16px;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);align-items:start}
@media (max-width:880px){.two{grid-template-columns:minmax(0,1fr)}}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.panel > h3{font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:10px}
.panel > h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line-hi),transparent)}
.panel > h3 .act{margin-left:auto;order:2}
.hint{font-size:.82rem;color:var(--muted)}

.btn{border:1px solid var(--line-hi);background:transparent;border-radius:5px;padding:4px 11px;font-size:.88rem}
.btn:hover{border-color:var(--gold);color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--bg);font-weight:500}
.btn.primary:hover{color:var(--bg);filter:brightness(1.08)}
.btn.link{border:0;padding:0;color:var(--arcane);text-decoration:underline;background:none}
.btn:disabled{opacity:.5;cursor:default}
.star{border:0;background:none;padding:0 2px;font-size:1.05rem;line-height:1;color:var(--line-hi)}
.star[aria-pressed="true"]{color:var(--gold)}
.star:hover{color:var(--gold)}
input[type=text],input[type=url],input[type=date],input[type=time],select,textarea{background:var(--inset);border:1px solid var(--line);border-radius:5px;padding:5px 9px;min-width:0}
textarea{resize:vertical;width:100%}
form.row,.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
form.row input[type=text]{flex:1 1 180px}
.empty{font-size:.9rem;color:var(--muted);font-style:italic}

/* lists */
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.list > li{padding:8px 0;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;min-width:0}
.list > li:first-child{border-top:0}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.date{font-family:var(--f-mono);font-size:.78rem;color:var(--muted);white-space:nowrap;padding-top:2px;min-width:5.5em}
.tag{font-size:.78rem;font-weight:700;color:var(--arcane)}

/* projects */
.projects{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.proj{border:1px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--inset);min-width:0}
.proj .name{font-family:var(--f-display);font-weight:600;font-size:1.05rem;display:flex;justify-content:space-between;gap:8px}
.proj .repo{font-family:var(--f-mono);font-size:.74rem;color:var(--muted);overflow-wrap:anywhere}
.proj .next{font-size:.92rem}
.proj .next b{font-weight:700;color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;display:block}
.proj .foot{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:auto}
.proj select{font-size:.8rem;padding:2px 4px}
.st-next{color:var(--gold)} .st-active{color:var(--ok)} .st-blocked{color:var(--bad)} .st-paused{color:var(--warn)} .st-shipped{color:var(--arcane)} .st-idea{color:var(--gold)}

/* upkeep */
.uk{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;align-items:center;background:var(--inset);border-radius:5px;padding:8px 10px 8px 0;margin-bottom:6px}
.uk .stripe{align-self:stretch;border-radius:5px 0 0 5px}
.uk.ok .stripe{background:var(--ok)} .uk.soon .stripe{background:var(--warn)} .uk.over .stripe{background:var(--bad)}
.uk .n{font-weight:500}
.uk .m{font-size:.76rem;color:var(--muted);font-family:var(--f-mono)}
.uk.over .m{color:var(--bad)} .uk.soon .m{color:var(--warn)}

/* stats */
.host{display:flex;flex-direction:column;gap:8px}
.host + .host{border-top:1px solid var(--line);padding-top:12px}
.host .hn{display:flex;justify-content:space-between;gap:8px;font-weight:700}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 14px}
.meter .lab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.meter .lab b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.bar{height:6px;background:var(--inset);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--arcane)}
.bar span.hot{background:var(--warn)} .bar span.crit{background:var(--bad)}
svg.spark{width:100%;height:38px;display:block}
.banner{font-size:.84rem;background:var(--warn-bg);color:var(--warn);border-radius:5px;padding:6px 10px}

/* plans */
.horizons{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:640px){.horizons{grid-template-columns:minmax(0,1fr)}}
.hz h4{margin:0 0 6px;font-family:var(--f-display);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.hz ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hz li{display:flex;gap:8px;align-items:flex-start}
.hz li.done span.t{text-decoration:line-through;color:var(--muted)}
input[type=checkbox]{accent-color:var(--gold);margin-top:5px}

/* notes */
.notes{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr);gap:14px}
@media (max-width:640px){.notes{grid-template-columns:minmax(0,1fr)}}
.note-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.note-list button{width:100%;text-align:left;border:0;background:none;padding:6px 8px;border-radius:5px;display:flex;justify-content:space-between;gap:6px}
.note-list button[aria-current="true"]{background:var(--inset);color:var(--gold)}
.note-list button:hover{background:var(--inset)}
.editor{display:flex;flex-direction:column;gap:8px}
.editor input[type=text]{font-family:var(--f-display);font-size:1.05rem}
.editor textarea{min-height:240px;font-family:var(--f-body);line-height:1.55}

/* calendar */
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .dow{font-family:var(--f-display);font-size:.72rem;letter-spacing:.08em;color:var(--muted);text-align:center;padding:2px 0}
.cell{min-height:78px;background:var(--inset);border:1px solid transparent;border-radius:5px;padding:4px 5px;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cell.out{opacity:.4}
.cell.today{border-color:var(--gold)}
.cell .dn{font-family:var(--f-mono);font-size:.74rem;color:var(--muted)}
.cell .ev{font-size:.74rem;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:3px;padding:1px 4px;background:var(--arcane-soft);color:var(--arcane)}
.cell .ev.uk{background:var(--warn-bg);color:var(--warn)}
@media (max-width:560px){.cell{min-height:52px}.cell .ev{font-size:0;height:5px;padding:0}}
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-nav b{font-family:var(--f-display);min-width:9em;text-align:center}

/* connect states */
.sealed{border:1px dashed var(--line-hi);border-radius:8px;padding:18px;display:flex;flex-direction:column;gap:8px;background:var(--inset)}
.sealed h4{margin:0;font-family:var(--f-display);color:var(--gold);letter-spacing:.06em}
.sealed ol{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}

/* apps */
.apps{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr));gap:10px}
.app{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--inset);min-width:0;text-decoration:none;color:inherit}
a.app:hover{border-color:var(--gold)}
.app .rune{width:34px;height:34px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;color:var(--gold);border:1px solid var(--line-hi);background:var(--panel)}
.app .an{font-family:var(--f-display);font-weight:600}
.app .ad{font-size:.85rem;color:var(--muted)}
.app .au{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.app .live{font-size:.74rem;margin-top:4px}
.group-name{font-family:var(--f-display);font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 0}
.yaml{font-family:var(--f-mono);font-size:.84rem;min-height:340px;line-height:1.5;tab-size:2;white-space:pre}
.err{color:var(--bad);font-size:.86rem;font-family:var(--f-mono);white-space:pre-wrap}
.okmsg{color:var(--ok);font-size:.86rem}

/* configure main */
.cfg{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
.cfg li{display:flex;align-items:center;gap:8px;background:var(--inset);border-radius:5px;padding:5px 8px}
.cfg li label{flex:1;display:flex;gap:8px;align-items:center}
.cfg input[type=checkbox]{margin-top:0}

.agent-out{white-space:pre-wrap;background:var(--inset);border-radius:5px;padding:10px;overflow-wrap:anywhere}

/* kanban */
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px}
.kcol{background:var(--inset);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:160px;min-width:0}
.kcol.drop{border-color:var(--gold);background:var(--gold-soft)}
.kcol h4{margin:0;font-family:var(--f-display);font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between}
.kcol h4 .n{font-family:var(--f-mono);color:var(--muted)}
.kcard{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:9px 10px;display:flex;flex-direction:column;gap:4px;cursor:grab}
.kcard.dragging{opacity:.45}
.kcard .name{font-family:var(--f-display);font-weight:600}
.kcard .repo{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);overflow-wrap:anywhere}
.kcard .next{font-size:.88rem}
.kcard .foot{display:flex;justify-content:space-between;align-items:center;gap:6px}
.kcard select{font-size:.76rem;padding:1px 3px}
.kcard .logs{font-size:.78rem}
.counter{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.counter.full{color:var(--warn)}

/* golem */
.golem{display:flex;flex-direction:column;gap:10px}
.golem-head{display:flex;align-items:center;gap:10px}
.golem-face{width:34px;height:34px;flex:none;border-radius:7px;background:var(--inset);border:1px solid var(--line-hi);display:grid;place-items:center;position:relative}
.golem-face::before,.golem-face::after{content:"";position:absolute;top:13px;width:6px;height:6px;border-radius:50%;background:var(--arcane);box-shadow:0 0 6px var(--arcane)}
.golem-face::before{left:8px}.golem-face::after{right:8px}
.golem-face.busy::before,.golem-face.busy::after{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow-y:auto;padding-right:4px}
.msg{padding:8px 11px;border-radius:8px;max-width:92%;white-space:pre-wrap;overflow-wrap:anywhere;font-size:.94rem}
.msg.user{align-self:flex-end;background:var(--gold-soft);border:1px solid var(--line)}
.msg.golem{align-self:flex-start;background:var(--inset);border:1px solid var(--line)}
.msg .did{display:block;font-family:var(--f-mono);font-size:.72rem;color:var(--arcane);margin-top:4px}
.golem form{display:flex;gap:8px}
.golem form textarea{flex:1;min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{font-size:.8rem;border:1px solid var(--line);background:var(--inset);border-radius:999px;padding:2px 10px}
.chips button:hover{border-color:var(--gold)}
.setting{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.setting:first-of-type{border-top:0}
.setting .d{font-size:.84rem;color:var(--muted)}
input[type=number]{background:var(--inset);border:1px solid var(--line);border-radius:5px;padding:5px 8px;width:5.5em}
.radio{display:flex;flex-direction:column;gap:6px}
.radio label{display:flex;gap:8px;align-items:flex-start}
.status-line{font-size:.8rem;color:var(--muted);font-family:var(--f-mono);margin-top:24px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div class="top-in">
    <div class="brand-row">
      <div class="brand">
        <div class="orb-wrap" aria-hidden="true"><canvas id="orb" width="108" height="108"></canvas></div>
        <div>
          <h1>Pondering Orb</h1>
          <div class="sub" id="today">The homelab, seen from the top of the tower</div>
        </div>
      </div>
      <div class="summary" id="summary"><span class="pill"><i></i>Gazing…</span></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Rooms"></nav>
  </div>
</header>

<main id="main"></main>
<div class="status-line" id="dbstatus" style="max-width:1240px;margin:0 auto 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))">Connecting to storage…</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const DAY = 864e5;
  const todayISO = () => { const d=new Date(); return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); };
  const isoOf = d => new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
  const fmtDate = iso => { const d = new Date(String(iso).length===10 ? iso+"T12:00:00" : iso); return isNaN(d) ? String(iso||"") : d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
  const ago = iso => { const ms = Date.now()-new Date(iso).getTime(); if (isNaN(ms)) return ""; const m=Math.round(ms/6e4); if(m<60) return m+" min ago"; const h=Math.round(m/60); if(h<48) return h+" h ago"; return Math.round(h/24)+" days ago"; };
  const isUrl = u => /^https?:\/\//.test(u||"");

  $("today").textContent = new Date().toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});

  // ---------- state ----------
  const S = { ideas:[], projects:[], logs:[], plans:[], upkeep:[], notes:[], events:[], stats:null, yaml:null, layout:null, settings:null, loaded:false };
  let db = null;
  let savedChat = [];
  try { savedChat = JSON.parse(localStorage.getItem("orb.golem") || "[]"); if (!Array.isArray(savedChat)) savedChat = []; } catch { savedChat = []; }
  const UI = { tab:"main", noteId:null, noteDraft:null, calMonth:new Date(new Date().getFullYear(), new Date().getMonth(), 1), logLimit:15, logFilter:"", configuring:false, yamlDraft:null, yamlMsg:"", confirmDel:null, dragId:null,
    golem:{busy:false, text:"", status:"", msgs:savedChat.slice(-30)} };

  const TABS = [
    {id:"main", label:"Main", title:"Scrying Table", flavor:"Everything you chose to keep in view."},
    {id:"projects", label:"Projects", title:"Workshop", flavor:"What is on the bench, and the log of how it got there."},
    {id:"ideas", label:"Ideas", title:"Alchemy Bench", flavor:"Ideas still in thought, design or first code. Promote one when it earns a place on the board."},
    {id:"notes", label:"Notes & Plans", title:"Library", flavor:"Notes worth keeping and plans for later."},
    {id:"calendar", label:"Calendar", title:"Star Chart", flavor:"Events and upkeep due dates by day."},
    {id:"mail", label:"Mail", title:"Raven Post", flavor:"Your inbox, once the ravens are allowed in."},
    {id:"upkeep", label:"Upkeep", title:"Wards", flavor:"Recurring checks that keep the tower standing."},
    {id:"system", label:"System", title:"Engine Room", flavor:"How the machines are holding up."},
    {id:"config", label:"Settings", title:"Sanctum", flavor:"Golem, logs, the Main table and the apps YAML."}
  ];

  const WIDGETS = {
    golem:{label:"Golem", wide:true}, favorites:{label:"Favorites"}, apps:{label:"Apps"}, week:{label:"Next 7 days"}, upkeep:{label:"Upkeep due"},
    projects:{label:"Active projects"}, ideas:{label:"Ideas brewing"}, system:{label:"System"}, log:{label:"Recent log"}, plans:{label:"Next plans"}, mail:{label:"Mail"}
  };
  const DEFAULT_MAIN = ["golem","favorites","apps","log","week","upkeep"];
  const mainLayout = () => (S.layout && Array.isArray(S.layout.main) ? S.layout.main.filter(w=>WIDGETS[w]) : DEFAULT_MAIN);

  const STATUSES = ["next","active","blocked","paused","shipped"];
  const STATUS_LABEL = {next:"Up next", active:"Active", blocked:"Blocked", paused:"Paused", shipped:"Shipped"};
  const STAGES = ["thought","design","code"];
  const STAGE_LABEL = {thought:"Thought", design:"Design", code:"Code"};
  const STAGE_HINT = {thought:"Just a spark. Why would it matter?", design:"Sketching how it works.", code:"First code, no promises."};
  const settings = () => ({ logMax:50, golemWrites:true, golemBrain:"claude", argosConnector:"Argos", ...(S.settings||{}) });
  const logMax = () => Math.max(20, Math.min(200, Number(settings().logMax)||50));

  // ---------- yaml config ----------
  let CFG = { groups:[], favorites:[] }, cfgError = "";
  function parseYaml(text){
    if (!window.jsyaml) return { cfg:null, error:"The YAML reader did not load." };
    try {
      const c = window.jsyaml.load(text || "") || {};
      if (typeof c !== "object") return { cfg:null, error:"The config must be a mapping with groups: and favorites:." };
      const groups = (Array.isArray(c.groups) ? c.groups : []).map(g => ({ name:String(g?.name||"Apps"), apps:(Array.isArray(g?.apps)?g.apps:[]).filter(a=>a&&a.name).map(a=>({ name:String(a.name), url:String(a.url||""), description:String(a.description||""), rune:String(a.rune||a.name[0]||"?").slice(0,2), live:a.live||null, links:Array.isArray(a.links)?a.links:[] })) }));
      const favorites = Array.isArray(c.favorites) ? c.favorites : [];
      return { cfg:{groups,favorites}, error:"" };
    } catch(e){ return { cfg:null, error: e.message || String(e) }; }
  }
  function applyYaml(){
    const r = parseYaml(S.yaml);
    if (r.cfg){ CFG = r.cfg; cfgError = ""; } else { cfgError = r.error; }
  }
  const allApps = () => CFG.groups.flatMap(g=>g.apps);
  const findApp = n => allApps().find(a => a.name.toLowerCase() === String(n).toLowerCase());

  // ---------- helpers ----------
  function upkeepState(u){
    const last = u.lastDone ? new Date(u.lastDone+"T12:00:00").getTime() : 0;
    const due = last + (Number(u.everyDays)||7)*DAY;
    const left = Math.floor((due - Date.now())/DAY);
    return { due, left, cls: left<0 ? "over" : left<=1 ? "soon" : "ok" };
  }
  const upkeepSorted = () => S.upkeep.map(u=>({u,s:upkeepState(u)})).sort((a,b)=>a.s.due-b.s.due);
  function agendaBetween(fromISO, toISO){
    const items = S.events.filter(e=>e.date>=fromISO && e.date<=toISO).map(e=>({date:e.date, time:e.time||"", title:e.title, kind:"ev", id:e._id}));
    for (const {u,s} of upkeepSorted()){
      const d = isoOf(new Date(Math.max(s.due, Date.now())));
      if (d>=fromISO && d<=toISO) items.push({date:d, time:"", title:u.name, kind:"uk", over:s.left<0});
    }
    return items.sort((a,b)=> a.date.localeCompare(b.date) || a.time.localeCompare(b.time));
  }
  const star = (coll, item) => `<button class="star" data-act="fav" data-coll="${coll}" data-id="${esc(item._id)}" aria-pressed="${item.fav?"true":"false"}" aria-label="${item.fav?"Remove from":"Add to"} favorites">${item.fav?"★":"☆"}</button>`;

  function meter(label, v, unit="%", warnAt=80, critAt=90){
    const n = Number(v); if (isNaN(n)) return "";
    const cls = n>=critAt?"crit":n>=warnAt?"hot":"";
    return `<div class="meter"><div class="lab"><span>${label}</span><b>${n}${unit}</b></div><div class="bar"><span class="${cls}" style="width:${Math.min(n,100)}%"></span></div></div>`;
  }
  function spark(vals){
    if (!Array.isArray(vals) || vals.length<2) return "";
    const w=200,h=38,p=3;
    const pts = vals.map((v,i)=>[p+i*(w-2*p)/(vals.length-1), h-p-(Math.min(+v||0,100)/100)*(h-2*p)]);
    const line = pts.map(q=>q.map(n=>n.toFixed(1)).join(",")).join(" ");
    const [ex,ey] = pts[pts.length-1];
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="CPU over recent hours">
      <line x1="${p}" x2="${w-p}" y1="${h/2}" y2="${h/2}" stroke="var(--line)" stroke-width="1" vector-effect="non-scaling-stroke"/>
      <polygon points="${p},${h-p} ${line} ${w-p},${h-p}" fill="var(--arcane-soft)"/>
      <polyline points="${line}" fill="none" stroke="var(--arcane)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
      <circle cx="${ex}" cy="${ey}" r="2.5" fill="var(--arcane)"/></svg>`;
  }

  // ---------- building blocks ----------
  function hostsHTML(compact){
    const st = S.stats, hosts = (st && st.hosts) || [];
    if (!hosts.length) return `<div class="empty">No host has reported yet.</div>`;
    return (st.example ? `<div class="banner">Example numbers. Nothing on your network reports here yet.</div>` : "") +
      hosts.map(h=>`<div class="host">
        <div class="hn"><span>${esc(h.name)}</span><span class="small muted mono">${h.uptimeDays!=null?"up "+esc(h.uptimeDays)+"d":""}${h.tempC!=null?" · "+esc(h.tempC)+"°C":""}</span></div>
        <div class="meters">${meter("CPU",h.cpu,"%",75,90)}${meter("Memory",h.mem)}${meter("Disk",h.disk)}${h.gpu!=null?meter("GPU VRAM",h.gpu,"%",85,95):""}</div>
        ${compact?"":spark(h.cpuHistory)}</div>`).join("") +
      (st.reportedAt ? `<div class="hint">Reported ${esc(ago(st.reportedAt))}</div>` : "");
  }
  function upkeepHTML(limit){
    let list = upkeepSorted(); if (limit) list = list.filter(x=>x.s.cls!=="ok").slice(0,limit);
    if (!list.length) return `<div class="empty">${limit?"All wards hold. Nothing due.":"No checks yet. Add backups, updates, disk scrubs."}</div>`;
    return list.map(({u,s})=>{
      const msg = s.left<0 ? `${-s.left} day${s.left===-1?"":"s"} overdue` : s.left===0 ? "due today" : `due in ${s.left} day${s.left===1?"":"s"}`;
      return `<div class="uk ${s.cls}"><span class="stripe"></span><div><div class="n">${esc(u.name)}</div><div class="m">${msg} · every ${esc(u.everyDays)}d · last ${u.lastDone?esc(fmtDate(u.lastDone)):"never"}</div></div>
        <button class="btn" data-act="upkeep-done" data-id="${esc(u._id)}">Done</button></div>`;
    }).join("");
  }
  const statusSelect = p => `<select data-act="proj-status" data-id="${esc(p._id)}" class="st-${esc(p.status)}" aria-label="Move ${esc(p.name)}">${STATUSES.map(s=>`<option value="${s}" ${s===p.status?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select>`;
  function projectCards(){
    const list = S.projects.filter(p=>p.status==="active"||p.status==="blocked").sort((a,b)=>String(a.name).localeCompare(b.name));
    if (!list.length) return `<div class="empty">Nothing active. Move a card on the Projects board.</div>`;
    return `<div class="projects">${list.map(p=>`<article class="proj">
      <div class="name"><span>${esc(p.name)}</span><span class="small st-${esc(p.status)}">${esc(p.status)}</span></div>
      ${p.next?`<div class="next"><b>Next</b>${esc(p.next)}</div>`:""}</article>`).join("")}</div>`;
  }
  function kanbanHTML(){
    const logCount = {}; S.logs.forEach(l=>{ logCount[l.project] = (logCount[l.project]||0)+1; });
    return `<div class="kanban" role="list">${STATUSES.map(s=>{
      const cards = S.projects.filter(p=>(STATUSES.includes(p.status)?p.status:"next")===s).sort((a,b)=>String(b.updated||"").localeCompare(String(a.updated||"")));
      return `<div class="kcol" data-col="${s}" role="listitem" aria-label="${STATUS_LABEL[s]}"><h4><span class="st-${s}">${STATUS_LABEL[s]}</span><span class="n">${cards.length}</span></h4>
        ${cards.map(p=>`<article class="kcard" draggable="true" data-card="${esc(p._id)}">
          <div class="name">${esc(p.name)}</div>
          ${p.repo?`<div class="repo">${esc(p.repo)}</div>`:""}
          ${p.next?`<div class="next">${esc(p.next)}</div>`:""}
          <div class="foot">${statusSelect(p)}${logCount[p.name]?`<button class="btn link logs" data-act="log-filter" data-p="${esc(p.name)}">${logCount[p.name]} log${logCount[p.name]>1?"s":""}</button>`:""}</div>
        </article>`).join("") || `<div class="empty small">Drop a card here.</div>`}</div>`;
    }).join("")}</div>`;
  }
  const logSorted = () => [...S.logs].sort((a,b)=>String(b.date).localeCompare(String(a.date)) || (b.created||0)-(a.created||0));
  function logForm(){
    const max = logMax();
    return `<form class="row" data-form="log"><select name="project" aria-label="Project">${["General",...S.projects.map(p=>p.name)].map(n=>`<option ${n===UI.logFilter?"selected":""}>${esc(n)}</option>`).join("")}</select>
      <input type="text" name="text" maxlength="${max}" data-counter placeholder="What changed (${max} characters)" aria-label="Log entry, up to ${max} characters" required>
      <span class="counter">0/${max}</span><button class="btn primary" type="submit">Log it</button></form>`;
  }
  function logHTML(limit, withFilter){
    let list = logSorted();
    if (withFilter && UI.logFilter) list = list.filter(l=>l.project===UI.logFilter);
    const names = [...new Set(S.logs.map(l=>l.project))].sort();
    const filter = withFilter ? `<div class="row"><label class="hint" for="log-filter">Show</label><select id="log-filter" data-act="log-filter-select"><option value="">All projects</option>${names.map(n=>`<option ${n===UI.logFilter?"selected":""}>${esc(n)}</option>`).join("")}</select>
      ${UI.logFilter?`<button class="btn" data-act="log-filter" data-p="">Clear filter</button>`:""}</div>` : "";
    const body = list.length ? `<ul class="list">${list.slice(0,limit).map(l=>`<li><span class="date">${esc(l.date)}</span><div class="grow"><button class="btn link tag" data-act="log-filter" data-p="${esc(l.project)}" title="Show only ${esc(l.project)}">${esc(l.project)}</button> ${esc(l.text)}${l.by==="golem"?` <span class="hint">· Golem</span>`:""}</div></li>`).join("")}</ul>`
      : `<div class="empty">${UI.logFilter&&withFilter?"No entries for "+esc(UI.logFilter)+".":"No log entries yet."}</div>`;
    return filter + body + (list.length>limit && withFilter ? `<button class="btn" data-act="log-more">Show older</button>` : "");
  }
  function plansHTML(only){
    const hz = {next:"Next", later:"Later", someday:"Someday"};
    const keys = only ? [only] : Object.keys(hz);
    const block = k => {
      const items = S.plans.filter(p=>(p.horizon||"later")===k).sort((a,b)=>(a.done?1:0)-(b.done?1:0));
      return `<div class="hz">${only?"":`<h4>${hz[k]}</h4>`}<ul>${items.length ? items.map(p=>`<li class="${p.done?"done":""}">
        <input type="checkbox" data-act="plan-toggle" data-id="${esc(p._id)}" ${p.done?"checked":""} aria-label="Done: ${esc(p.text)}">
        <span class="t grow">${esc(p.text)}</span>${star("plans",p)}</li>`).join("") : `<li class="empty">Nothing here.</li>`}</ul></div>`;
    };
    return only ? block(only) : `<div class="horizons">${keys.map(block).join("")}</div>`;
  }
  function agendaHTML(days){
    const from = todayISO(), to = isoOf(new Date(Date.now()+days*DAY));
    const items = agendaBetween(from, to);
    if (!items.length) return `<div class="empty">Nothing in the next ${days} days.</div>`;
    return `<ul class="list">${items.map(i=>`<li><span class="date">${i.kind==="uk"&&i.over?"overdue":esc(new Date(i.date+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric"}))}${i.time?" "+esc(i.time):""}</span><div class="grow">${i.kind==="uk"?`<span class="tag" style="color:var(--warn)">upkeep</span> `:""}${esc(i.title)}</div></li>`).join("")}</ul>`;
  }
  function favoritesHTML(){
    const out = [];
    for (const n of S.notes.filter(x=>x.fav)) out.push(`<li><span class="date">note</span><div class="grow"><button class="btn link" data-act="open-note" data-id="${esc(n._id)}">${esc(n.title||"Untitled")}</button></div>${star("notes",n)}</li>`);
    for (const p of S.plans.filter(x=>x.fav&&!x.done)) out.push(`<li><span class="date">plan</span><div class="grow">${esc(p.text)}</div>${star("plans",p)}</li>`);
    return out.length ? `<ul class="list">${out.join("")}</ul>` : `<div class="empty">Star a note or plan in Notes &amp; Plans to keep it here.</div>`;
  }
  function appsHTML(compact){
    if (!CFG.groups.length) return `<div class="empty">No apps yet. Add a group in the YAML below.</div>`;
    return CFG.groups.map(g=>`${compact?"":`<h4 class="group-name">${esc(g.name)}</h4>`}<div class="apps">${g.apps.map(a=>{
      const inner = `<span class="rune">${esc(a.rune)}</span><span class="grow"><div class="an">${esc(a.name)}</div>${a.description&&!compact?`<div class="ad">${esc(a.description)}</div>`:""}${compact?"":`<div class="au">${esc(a.url)}</div>`}
        ${a.live&&!compact?`<div class="live"><span class="pill warn"><i></i>Live: waiting for ${esc(a.live.source||"a connector")}</span></div>`:""}
        ${!compact&&a.links.length?`<div class="row small" style="margin-top:4px">${a.links.filter(l=>isUrl(l.url)).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label||l.url)}</a>`).join("")}</div>`:""}</span>`;
      return isUrl(a.url) && (compact || !a.links.length) ? `<a class="app" href="${esc(a.url)}" target="_blank" rel="noopener">${inner}</a>` : `<div class="app">${inner}</div>`;
    }).join("")}</div>`).join("");
  }
  function sealedMail(){
    return `<div class="sealed"><h4>The ravens are not allowed in yet</h4>
      <p class="small" style="margin:0">Gmail is installed on your claude.ai account but not connected. Once it is connected, this room can list unread threads and flag mail about your stack.</p>
      <ol class="small"><li>In claude.ai, open Settings, then Connectors, and connect Gmail.</li><li>Ask Claude to wire the Mail room to it.</li></ol></div>`;
  }

  function ideasCompact(){
    const list = S.ideas.filter(i=>!i.promoted);
    if (!list.length) return `<div class="empty">No ideas brewing. Add one in Ideas.</div>`;
    return `<ul class="list">${STAGES.flatMap(st=>list.filter(i=>i.stage===st).map(i=>`<li><span class="date">${STAGE_LABEL[st]}</span><div class="grow">${esc(i.title)}</div></li>`)).join("")}</ul>`;
  }
  function golemHTML(){
    const g = UI.golem, st = settings();
    const msgs = g.msgs.length ? g.msgs.map(m=>`<div class="msg ${m.role==="user"?"user":"golem"}">${esc(m.content)}${m.did&&m.did.length?`<span class="did">${m.did.map(esc).join(" · ")}</span>`:""}</div>`).join("")
      : `<div class="msg golem">Golem stands ready. Ask what to work on, or tell me what you did and I will log it.</div>`;
    return `<div class="golem">
      <div class="golem-head"><span class="golem-face ${g.busy?"busy":""}" aria-hidden="true"></span>
        <div class="grow"><div class="small">Brain: ${st.golemBrain==="argos"?"Argos (not connected, using Claude)":"Claude"} · ${st.golemWrites?"can write logs, plans and ideas":"read only"}</div>
        <div class="hint" id="golem-status">${esc(g.status)}</div></div>
        ${g.msgs.length?`<button class="btn" data-act="golem-clear">Clear</button>`:""}<a class="btn" href="#config">Settings</a></div>
      <div class="chat" id="chat" aria-live="polite">${msgs}<div class="msg golem" id="golem-live" ${g.busy?"":"hidden"}>${esc(g.live||"…")}</div></div>
      ${g.msgs.length?"":`<div class="chips">${["What should I work on next?","Log: fixed the Argos watcher tests","What upkeep is overdue?","Summarize this week's logs"].map(q=>`<button data-act="golem-chip" data-q="${esc(q)}">${esc(q)}</button>`).join("")}</div>`}
      <form data-form="golem"><textarea id="golem-in" name="q" rows="1" placeholder="Speak to the Golem" aria-label="Message to Golem">${esc(g.text)}</textarea><button class="btn primary" type="submit" ${g.busy?"disabled":""}>Send</button></form>
    </div>`;
  }

  const W = {
    golem:()=>golemHTML(),
    favorites:()=>favoritesHTML(),
    week:()=>agendaHTML(7),
    upkeep:()=>upkeepHTML(5),
    projects:()=>projectCards(),
    ideas:()=>ideasCompact(),
    system:()=>hostsHTML(true),
    log:()=>logForm() + logHTML(6, false),
    plans:()=>plansHTML("next"),
    mail:()=>`<div class="empty">Gmail is not connected yet. <a href="#mail">See the Mail room</a>.</div>`,
    apps:()=>appsHTML(true)
  };

  // ---------- rooms ----------
  function roomHead(t, extra=""){ return `<div class="room-head"><div class="titles"><h2>${esc(t.title)}</h2><span class="flavor">${esc(t.flavor)}</span></div>${extra}</div>`; }
  function arrangeHTML(){
    const layout = mainLayout();
    return `<ul class="cfg">${[...layout, ...Object.keys(WIDGETS).filter(k=>!layout.includes(k))].map(k=>{
      const on = layout.includes(k);
      return `<li><label><input type="checkbox" data-act="cfg-toggle" data-w="${k}" ${on?"checked":""}> ${esc(WIDGETS[k].label)}</label>
        ${on?`<button class="btn" data-act="cfg-move" data-w="${k}" data-d="-1" aria-label="Move ${esc(WIDGETS[k].label)} up">↑</button><button class="btn" data-act="cfg-move" data-w="${k}" data-d="1" aria-label="Move ${esc(WIDGETS[k].label)} down">↓</button>`:""}</li>`;
    }).join("")}</ul><div class="row"><button class="btn" data-act="cfg-reset">Reset to default</button></div>`;
  }

  const ROOMS = {
    main(t){
      const layout = mainLayout();
      const cfg = UI.configuring ? `<section class="panel"><h3>Arrange the table</h3><p class="hint" style="margin:0">Tick what to show and move it up or down. Also in Settings.</p>${arrangeHTML()}</section>` : "";
      return roomHead(t, `<button class="btn" data-act="cfg-open">${UI.configuring?"Done arranging":"Arrange"}</button>`) + cfg +
        (layout.length ? `<div class="grid">${layout.map(k=>`<section class="panel" ${WIDGETS[k].wide?'style="grid-column:1/-1"':""}><h3>${esc(WIDGETS[k].label)}</h3>${W[k]()}</section>`).join("")}</div>`
          : `<div class="empty">The table is empty. Use Arrange to choose what to show.</div>`);
    },
    projects(t){
      return roomHead(t) + `<section class="panel"><h3>Board</h3><p class="hint" style="margin:0">Drag a card to another column, or use its menu.</p>${kanbanHTML()}
          <form class="row" data-form="proj"><input type="text" name="name" placeholder="Project name" aria-label="Project name" required><input type="text" name="next" placeholder="Next step" aria-label="Next step">
          <select name="status" aria-label="Column">${STATUSES.map(s=>`<option value="${s}" ${s==="next"?"selected":""}>${STATUS_LABEL[s]}</option>`).join("")}</select><button class="btn primary" type="submit">Add project</button></form></section>
        <section class="panel"><h3>Project log</h3>${logForm()}${logHTML(UI.logLimit, true)}</section>`;
    },
    ideas(t){
      const live = S.ideas.filter(i=>!i.promoted), done = S.ideas.filter(i=>i.promoted);
      return roomHead(t) + `<section class="panel"><h3>Brewing</h3><div class="kanban" style="grid-template-columns:repeat(3,minmax(220px,1fr))">${STAGES.map(st=>{
          const cards = live.filter(i=>(STAGES.includes(i.stage)?i.stage:"thought")===st);
          return `<div class="kcol" data-stage="${st}"><h4><span>${STAGE_LABEL[st]}</span><span class="n">${cards.length}</span></h4><div class="hint">${STAGE_HINT[st]}</div>
            ${cards.map(i=>`<article class="kcard" draggable="true" data-idea="${esc(i._id)}"><div class="name">${esc(i.title)}</div>${i.pitch?`<div class="next">${esc(i.pitch)}</div>`:""}
              <div class="foot"><select data-act="idea-stage" data-id="${esc(i._id)}" aria-label="Stage of ${esc(i.title)}">${STAGES.map(s=>`<option value="${s}" ${s===i.stage?"selected":""}>${STAGE_LABEL[s]}</option>`).join("")}</select>
              <button class="btn" data-act="idea-promote" data-id="${esc(i._id)}">${UI.confirmDel===i._id?"Confirm promote":"Promote"}</button></div></article>`).join("") || `<div class="empty small">Nothing here.</div>`}</div>`;
        }).join("")}</div>
        <form class="row" data-form="idea"><input type="text" name="title" placeholder="Idea" aria-label="Idea" required><input type="text" name="pitch" placeholder="One line on why" aria-label="Why it matters"><button class="btn primary" type="submit">Add idea</button></form></section>
        ${done.length?`<section class="panel"><h3>Promoted to projects</h3><ul class="list">${done.map(i=>`<li><span class="date">${esc(fmtDate(i.promoted))}</span><div class="grow">${esc(i.title)}</div></li>`).join("")}</ul></section>`:""}`;
    },
    notes(t){
      const notes = [...S.notes].sort((a,b)=>(b.fav?1:0)-(a.fav?1:0) || String(b.updated||"").localeCompare(String(a.updated||"")));
      const cur = UI.noteId === "new" ? {title:"",body:"",_id:"new"} : notes.find(n=>n._id===UI.noteId) || notes[0];
      if (cur && UI.noteId !== "new") UI.noteId = cur._id;
      const draft = UI.noteDraft && UI.noteDraft.id === (cur&&cur._id) ? UI.noteDraft : null;
      return roomHead(t) + `<div class="two">
        <section class="panel"><h3>Notes <span class="act"><button class="btn" data-act="note-new">New note</button></span></h3>
          ${notes.length || UI.noteId==="new" ? `<div class="notes">
            <ul class="note-list">${notes.map(n=>`<li><button data-act="open-note" data-id="${esc(n._id)}" aria-current="${cur&&cur._id===n._id?"true":"false"}"><span class="grow">${esc(n.title||"Untitled")}</span>${n.fav?`<span style="color:var(--gold)">★</span>`:""}</button></li>`).join("")}</ul>
            ${cur ? `<form class="editor" data-form="note">
              <input type="text" id="note-title" name="title" value="${esc(draft?draft.title:cur.title)}" placeholder="Title" aria-label="Note title">
              <textarea id="note-body" name="body" aria-label="Note text" placeholder="Write it down before it slips away.">${esc(draft?draft.body:cur.body)}</textarea>
              <div class="row"><button class="btn primary" type="submit">Save note</button>
              ${cur._id!=="new" ? `${star("notes",cur)}<span class="grow"></span><button class="btn" type="button" data-act="note-del" data-id="${esc(cur._id)}">${UI.confirmDel===cur._id?"Click again to delete":"Delete"}</button>` : ""}
              <span class="hint">${cur.updated?"Saved "+esc(fmtDate(cur.updated)):""}</span></div></form>` : ""}
          </div>` : `<div class="empty">No notes yet. Start one with New note.</div>`}
        </section>
        <section class="panel"><h3>Plans</h3>${plansHTML()}
          <form class="row" data-form="plan"><input type="text" name="text" placeholder="An idea or plan" aria-label="Plan" required>
          <select name="horizon" aria-label="When"><option value="next">Next</option><option value="later">Later</option><option value="someday">Someday</option></select>
          <button class="btn primary" type="submit">Add plan</button></form></section></div>`;
    },
    calendar(t){
      const m = UI.calMonth, y = m.getFullYear(), mo = m.getMonth();
      const start = new Date(y, mo, 1 - ((new Date(y,mo,1).getDay()+6)%7));
      const cells = [];
      for (let i=0;i<42;i++){ const d = new Date(start.getFullYear(), start.getMonth(), start.getDate()+i); cells.push(d); }
      const from = isoOf(cells[0]), to = isoOf(cells[41]);
      const items = agendaBetween(from, to);
      const byDay = {}; items.forEach(i=>{ (byDay[i.date] = byDay[i.date] || []).push(i); });
      const today = todayISO();
      const grid = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d=>`<div class="dow">${d}</div>`).join("") + cells.map(d=>{
        const iso = isoOf(d), ev = byDay[iso] || [];
        return `<div class="cell ${d.getMonth()!==mo?"out":""} ${iso===today?"today":""}"><span class="dn">${d.getDate()}</span>${ev.slice(0,3).map(e=>`<span class="ev ${e.kind==="uk"?"uk":""}" title="${esc(e.title)}">${e.time?esc(e.time)+" ":""}${esc(e.title)}</span>`).join("")}${ev.length>3?`<span class="dn">+${ev.length-3}</span>`:""}</div>`;
      }).join("");
      return roomHead(t, `<span class="pill warn"><i></i>Google Calendar and CalDAV not linked</span>`) + `<div class="two">
        <section class="panel"><h3>${esc(m.toLocaleDateString(undefined,{month:"long",year:"numeric"}))}<span class="act cal-nav"><button class="btn" data-act="cal-prev" aria-label="Previous month">‹</button><button class="btn" data-act="cal-today">Today</button><button class="btn" data-act="cal-next" aria-label="Next month">›</button></span></h3>
          <div style="overflow-x:auto"><div class="month">${grid}</div></div>
          <div class="hint">Blue: your events. Amber: upkeep due.</div></section>
        <div class="room" style="gap:16px">
          <section class="panel"><h3>Next 14 days</h3>${agendaHTML(14)}</section>
          <section class="panel"><h3>Add an event</h3>
            <form class="row" data-form="event"><input type="text" name="title" placeholder="What" aria-label="Event title" required>
            <input type="date" name="date" value="${today}" aria-label="Date" required><input type="time" name="time" aria-label="Time"><button class="btn primary" type="submit">Add</button></form>
            ${S.events.length?`<ul class="list">${[...S.events].sort((a,b)=>a.date.localeCompare(b.date)).filter(e=>e.date>=today).slice(0,8).map(e=>`<li><span class="date">${esc(fmtDate(e.date))}</span><div class="grow">${esc(e.title)}</div><button class="btn" data-act="event-del" data-id="${esc(e._id)}" aria-label="Remove ${esc(e.title)}">Remove</button></li>`).join("")}</ul>`:""}
          </section>
          <div class="sealed"><h4>Linking a real calendar</h4><ol class="small">
            <li>Google Calendar: connect it in claude.ai Settings, Connectors, then ask Claude to wire this room.</li>
            <li>Odysseus (CalDAV): the page cannot reach your network directly. An n8n workflow or an Odysseus connector can bridge it.</li></ol></div>
        </div></div>`;
    },
    mail(t){ return roomHead(t, `<span class="pill warn"><i></i>Gmail not connected</span>`) + sealedMail(); },
    upkeep(t){
      return roomHead(t) + `<div class="two"><section class="panel"><h3>All checks</h3>${upkeepHTML(0)}
        <form class="row" data-form="upkeep"><input type="text" name="name" placeholder="Check (e.g. test a restore)" aria-label="Check name" required>
        <select name="every" aria-label="How often"><option value="1">Daily</option><option value="7" selected>Weekly</option><option value="30">Monthly</option><option value="90">Quarterly</option></select>
        <button class="btn primary" type="submit">Add check</button></form></section>
        <section class="panel"><h3>How the wards work</h3><p class="small" style="margin:0">Each check has a period. It turns amber a day before it is due and red once it is overdue. Done stamps today's date. The overdue count shows in the header on every tab.</p></section></div>`;
    },
    system(t){
      return roomHead(t) + `<div class="two"><section class="panel"><h3>Hosts</h3>${hostsHTML(false)}</section>
        <div class="sealed"><h4>Making the numbers live</h4><ol class="small">
        <li>The page cannot read your hosts directly; something has to report.</li>
        <li>Simplest path: an n8n workflow that collects stats (Glances, node_exporter or Proxmox API) and connects through the n8n connector.</li>
        <li>Until then, Claude can update the numbers on request.</li></ol></div></div>`;
    },
    config(t){
      const st = settings(), draft = UI.yamlDraft ?? S.yaml ?? "";
      return roomHead(t) + `<div class="two"><div class="room" style="gap:16px">
        <section class="panel"><h3>Golem</h3>
          <div class="setting"><div><div>Brain</div><div class="d">Which model Golem thinks with.</div></div><span></span></div>
          <div class="radio">
            <label><input type="radio" name="brain" data-act="set-brain" value="claude" ${st.golemBrain!=="argos"?"checked":""}> <span><b>Claude</b> <span class="d">Works now, uses your claude.ai account.</span></span></label>
            <label><input type="radio" name="brain" data-act="set-brain" value="argos" ${st.golemBrain==="argos"?"checked":""}> <span><b>Argos</b> <span class="d">Your local models. Needs the Argos connector (below); until then Golem falls back to Claude.</span></span></label>
          </div>
          <div class="setting"><div><div>Golem may write</div><div class="d">Add logs, plans and ideas, and move project cards, when you ask.</div></div><input type="checkbox" data-act="set-writes" ${st.golemWrites?"checked":""} aria-label="Golem may write"></div>
          <div class="sealed"><h4>Connecting Argos</h4><ol class="small">
            <li>Argos serves MCP at <span class="mono">/api/mcp</span> (pool_status, requests_in_flight, recent_requests, docs search).</li>
            <li>Publish it through your Cloudflare tunnel behind auth, for example <span class="mono">https://argos.example.com/api/mcp</span>.</li>
            <li>In claude.ai Settings, Connectors, add it as a custom connector named Argos.</li>
            <li>Ask Claude to wire Golem to it. Golem can then read GPU and request status. Chatting with Argos models needs a chat tool added to that MCP server.</li></ol></div>
        </section>
        <section class="panel"><h3>Logs</h3>
          <form class="setting" data-form="logmax"><div><label for="logmax">Log entry length</label><div class="d">Most characters in one entry, for you and Golem. 20 to 200.</div></div>
          <div class="row"><input type="number" id="logmax" name="logmax" min="20" max="200" value="${logMax()}"><button class="btn" type="submit">Save</button></div></form>
        </section>
        <section class="panel"><h3>Main table</h3>${arrangeHTML()}</section></div>
        <section class="panel"><h3>Apps (orb.yaml)</h3>
          <p class="hint" style="margin:0">Groups hold apps. Each app takes name, url, description, rune (one or two letters), optional links, and an optional live: block for data a connector will feed later.</p>
          <textarea class="yaml" id="yaml" spellcheck="false" aria-label="Apps configuration in YAML">${esc(draft)}</textarea>
          <div class="row"><button class="btn primary" data-act="yaml-save">Save YAML</button><button class="btn" data-act="yaml-revert">Discard changes</button>
          ${UI.yamlMsg?`<span class="okmsg">${esc(UI.yamlMsg)}</span>`:""}</div>
          ${cfgError?`<div class="err">${esc(cfgError)}</div>`:""}
          <h4 class="group-name">Preview</h4>${appsHTML(false)}</section></div>`;
    }
  };

  // ---------- render ----------
  function renderSummary(){
    if (!S.loaded) return;
    const st = S.upkeep.map(upkeepState);
    const over = st.filter(s=>s.cls==="over").length, soon = st.filter(s=>s.cls==="soon").length;
    const active = S.projects.filter(p=>p.status==="active").length, blocked = S.projects.filter(p=>p.status==="blocked").length;
    const hosts = (S.stats && S.stats.hosts) || [];
    const hot = hosts.filter(h=>(h.disk||0)>=85 || (h.mem||0)>=90).length;
    const p = [`<span class="pill info"><i></i>${active} active</span>`];
    if (blocked) p.push(`<span class="pill bad"><i></i>${blocked} blocked</span>`);
    p.push(over ? `<span class="pill bad"><i></i>${over} overdue</span>` : `<span class="pill ok"><i></i>Upkeep on track</span>`);
    if (soon) p.push(`<span class="pill warn"><i></i>${soon} due soon</span>`);
    if (hosts.length) p.push(hot ? `<span class="pill warn"><i></i>${hot} host${hot>1?"s":""} running hot</span>` : `<span class="pill ok"><i></i>Hosts normal</span>`);
    $("summary").innerHTML = p.join("");
  }
  function renderTabs(){
    $("tabs").innerHTML = TABS.map(t=>`<a href="#${t.id}" ${t.id===UI.tab?'aria-current="page"':""}>${esc(t.label)}</a>`).join("");
  }
  function captureDrafts(){
    const ti = $("note-title"), bo = $("note-body");
    if (ti && bo && UI.noteId) UI.noteDraft = {id:UI.noteId, title:ti.value, body:bo.value};
    const y = $("yaml"); if (y) UI.yamlDraft = y.value === (S.yaml ?? "") ? null : y.value;
    const a = $("golem-in"); if (a) UI.golem.text = a.value;
  }
  function render(){
    captureDrafts();
    const active = document.activeElement && document.activeElement.id;
    renderSummary(); renderTabs();
    const t = TABS.find(x=>x.id===UI.tab) || TABS[0];
    $("main").innerHTML = `<div class="room">${ROOMS[t.id](t)}</div>`;
    if (active && $(active) && /^(note-title|note-body|yaml|golem-in|logmax)$/.test(active)) $(active).focus();
  }
  function route(){
    const h = location.hash.replace(/^#/,"");
    UI.tab = TABS.some(t=>t.id===h) ? h : "main";
    render();
  }
  window.addEventListener("hashchange", route);
  route();

  // ---------- storage ----------
  const setStatus = t => { $("dbstatus").textContent = t; };
  const fail = e => setStatus("Could not save: " + (e && (e.message||e.code) || "unknown error"));
  let pending = null;
  const schedule = () => { if (pending) return; pending = requestAnimationFrame(()=>{ pending=null; render(); }); };
  (async () => {
    const timer = setTimeout(()=>setStatus("Storage is slow to answer. Changes may not save yet."), 10000);
    try { db = await window.claude?.use?.("db"); } catch { db = null; }
    if (!db){ clearTimeout(timer); setStatus("Storage is not available in this view. Open the page signed in on claude.ai to save changes."); S.loaded = true; render(); return; }
    const err = e => setStatus("Lost connection to storage: " + (e.message||e.code));
    for (const k of ["ideas","projects","logs","plans","upkeep","notes","events"]){
      db.collection(k).onSnapshot(snap => { clearTimeout(timer); S[k] = snap.docs.map(d=>({...d.data(), _id:d.id})); S.loaded = true; setStatus("Changes save for everyone who opens this page."); schedule(); }, err);
    }
    db.doc("stats/current").onSnapshot(s => { S.stats = s.exists ? s.data() : null; schedule(); }, err);
    db.doc("config/orb").onSnapshot(s => { S.yaml = s.exists ? String(s.data().yaml||"") : ""; applyYaml(); schedule(); }, err);
    db.doc("config/layout").onSnapshot(s => { S.layout = s.exists ? s.data() : null; schedule(); }, err);
    db.doc("config/settings").onSnapshot(s => { S.settings = s.exists ? s.data() : null; schedule(); }, err);
  })();
  const need = () => { if (!db){ setStatus("Storage is not available, so this change was not saved."); return false; } return true; };

  async function saveSettings(patch){ if(!need()) return; const next = {...(S.settings||{}), ...patch}; S.settings = next; render(); try { await db.doc("config/settings").set(next); } catch(e){ fail(e); } }
  async function saveLayout(list){ if(!need()) return; S.layout = {main:list}; render(); try { await db.doc("config/layout").set({main:list}); } catch(e){ fail(e); } }

  // ---------- events ----------
  document.addEventListener("click", async e => {
    const el = e.target.closest("[data-act]"); if (!el) return;
    const act = el.dataset.act, id = el.dataset.id;
    if (el.tagName === "INPUT" || el.tagName === "SELECT") return;
    if (act !== "note-del" && act !== "idea-promote") UI.confirmDel = null;
    switch (act){
      case "fav": { if(!need())return; const item = S[el.dataset.coll].find(x=>x._id===id); if(item) db.doc(el.dataset.coll+"/"+id).update({fav:!item.fav}).catch(fail); break; }
      case "upkeep-done": if(!need())return; el.disabled = true; db.doc("upkeep/"+id).update({lastDone:todayISO()}).catch(fail); break;
      case "log-more": UI.logLimit += 25; render(); break;
      case "open-note": UI.noteId = id; UI.noteDraft = null; if (UI.tab!=="notes") location.hash = "notes"; else render(); break;
      case "note-new": UI.noteId = "new"; UI.noteDraft = null; render(); $("note-title")?.focus(); break;
      case "note-del": if (UI.confirmDel !== id){ UI.confirmDel = id; render(); break; } if(!need())return; UI.confirmDel = null; UI.noteId = null; db.doc("notes/"+id).delete().catch(fail); break;
      case "cal-prev": UI.calMonth = new Date(UI.calMonth.getFullYear(), UI.calMonth.getMonth()-1, 1); render(); break;
      case "cal-next": UI.calMonth = new Date(UI.calMonth.getFullYear(), UI.calMonth.getMonth()+1, 1); render(); break;
      case "cal-today": UI.calMonth = new Date(new Date().getFullYear(), new Date().getMonth(), 1); render(); break;
      case "event-del": if(!need())return; db.doc("events/"+id).delete().catch(fail); break;
      case "cfg-open": UI.configuring = !UI.configuring; render(); break;
      case "cfg-move": { const l = [...mainLayout()], i = l.indexOf(el.dataset.w), j = i + Number(el.dataset.d); if (i<0||j<0||j>=l.length) break; [l[i],l[j]] = [l[j],l[i]]; saveLayout(l); break; }
      case "cfg-reset": saveLayout([...DEFAULT_MAIN]); break;
      case "yaml-save": {
        const text = $("yaml").value, r = parseYaml(text);
        if (!r.cfg){ cfgError = r.error; UI.yamlDraft = text; UI.yamlMsg = ""; render(); break; }
        if(!need())return;
        try { await db.doc("config/orb").set({yaml:text}); UI.yamlDraft = null; UI.yamlMsg = "Saved."; cfgError=""; } catch(err){ fail(err); }
        render(); break;
      }
      case "yaml-revert": UI.yamlDraft = null; UI.yamlMsg = ""; applyYaml(); render(); break;
      case "log-filter": UI.logFilter = el.dataset.p || ""; if (UI.tab!=="projects") location.hash = "projects"; else render(); break;
      case "golem-chip": golemSend(el.dataset.q); break;
      case "golem-clear": UI.golem.msgs = []; persistChat(); render(); break;
      case "idea-promote": {
        if (UI.confirmDel !== id){ UI.confirmDel = id; render(); break; }
        UI.confirmDel = null; if(!need()) return; const i = S.ideas.find(x=>x._id===id); if (!i) break;
        try { await db.collection("projects").add({name:i.title, next:i.pitch||"", status:"next", repo:"", updated:todayISO()}); await db.doc("ideas/"+id).update({promoted:todayISO()}); setStatus("Promoted to Up next on the Projects board."); } catch(err){ fail(err); }
        break;
      }
    }
  });
  document.addEventListener("change", e => {
    const el = e.target, act = el.dataset && el.dataset.act; if (!act) return;
    if (act === "proj-status"){ if(!need())return; db.doc("projects/"+el.dataset.id).update({status:el.value, updated:todayISO()}).catch(fail); }
    if (act === "plan-toggle"){ if(!need())return; db.doc("plans/"+el.dataset.id).update({done:el.checked}).catch(fail); }
    if (act === "log-filter-select"){ UI.logFilter = el.value; render(); }
    if (act === "idea-stage"){ if(!need())return; db.doc("ideas/"+el.dataset.id).update({stage:el.value, updated:todayISO()}).catch(fail); }
    if (act === "set-brain"){ saveSettings({golemBrain:el.value}); }
    if (act === "set-writes"){ saveSettings({golemWrites:el.checked}); }
    if (act === "cfg-toggle"){ const l = mainLayout().filter(w=>w!==el.dataset.w); if (el.checked) l.push(el.dataset.w); saveLayout(l); }
  });
  document.addEventListener("submit", async e => {
    const f = e.target.closest("form[data-form]"); if (!f) return;
    e.preventDefault(); if(!need()) return;
    const v = Object.fromEntries(new FormData(f).entries());
    try {
      switch (f.dataset.form){
        case "proj": if(!v.name.trim()) return; await db.collection("projects").add({name:v.name.trim(), next:(v.next||"").trim(), status:STATUSES.includes(v.status)?v.status:"next", repo:"", updated:todayISO()}); break;
        case "log": if(!v.text.trim()) return; await db.collection("logs").add({date:todayISO(), project:v.project||"General", text:v.text.trim().slice(0,logMax()), created:Date.now()}); f.reset(); const c = f.querySelector(".counter"); if (c) c.textContent = "0/"+logMax(); return;
        case "idea": if(!v.title.trim()) return; await db.collection("ideas").add({title:v.title.trim(), pitch:(v.pitch||"").trim(), stage:"thought", updated:todayISO()}); break;
        case "logmax": await saveSettings({logMax:Math.max(20, Math.min(200, Number(v.logmax)||50))}); setStatus("Log length saved."); return;
        case "golem": golemSend(v.q); return;
        case "plan": if(!v.text.trim()) return; await db.collection("plans").add({text:v.text.trim(), horizon:v.horizon||"next", done:false, fav:false}); break;
        case "upkeep": if(!v.name.trim()) return; await db.collection("upkeep").add({name:v.name.trim(), everyDays:Number(v.every)||7, lastDone:""}); break;
        case "event": if(!v.title.trim()||!v.date) return; await db.collection("events").add({title:v.title.trim(), date:v.date, time:v.time||""}); break;
        case "note": {
          const data = {title:(v.title||"").trim()||"Untitled", body:v.body||"", updated:todayISO()};
          if (UI.noteId === "new" || !UI.noteId){ const ref = await db.collection("notes").add({...data, fav:false}); UI.noteId = ref.id; }
          else await db.doc("notes/"+UI.noteId).update(data);
          UI.noteDraft = null; setStatus("Note saved."); render(); return;
        }
      }
      f.reset();
    } catch(err){ fail(err); }
  });

  // ---------- golem ----------
  function persistChat(){ try { localStorage.setItem("orb.golem", JSON.stringify(UI.golem.msgs.slice(-30))); } catch {} }
  const clip = (t, n) => { t = String(t||"").replace(/\s+/g," ").trim(); return t.length>n ? t.slice(0,n-1).trimEnd()+"…" : t; };
  function golemTools(did){
    const st = settings(), max = logMax();
    const findProject = n => S.projects.find(p=>p.name.toLowerCase()===String(n||"").toLowerCase());
    const tools = [
      { name:"list_logs", description:"Returns log entries newest first as {date, project, text}. Optional project filters to one project name; limit defaults to 20.",
        inputSchema:{type:"object", properties:{project:{type:"string"}, limit:{type:"number"}}},
        execute:({project, limit}) => logSorted().filter(l=>!project || l.project.toLowerCase()===String(project).toLowerCase()).slice(0, Math.min(Number(limit)||20, 60)).map(l=>({date:l.date, project:l.project, text:l.text})) },
      { name:"list_projects", description:"Returns every project as {name, status, next, repo}. Status is one of next, active, blocked, paused, shipped.",
        execute:() => S.projects.map(p=>({name:p.name, status:p.status, next:p.next||"", repo:p.repo||""})) },
      { name:"list_ideas", description:"Returns ideas not yet promoted as {title, stage, pitch}. Stage is thought, design or code.",
        execute:() => S.ideas.filter(i=>!i.promoted).map(i=>({title:i.title, stage:i.stage, pitch:i.pitch||""})) },
      { name:"list_upkeep", description:"Returns upkeep checks as {name, everyDays, lastDone, daysLeft}; negative daysLeft means overdue.",
        execute:() => S.upkeep.map(u=>({name:u.name, everyDays:u.everyDays, lastDone:u.lastDone||"never", daysLeft:upkeepState(u).left})) }
    ];
    if (st.golemWrites && db) tools.push(
      { name:"add_log", description:`Adds one log entry for today. text must be at most ${max} characters: short, past tense, no project name in it. project must be an existing project name or "General". Returns the saved entry.`,
        inputSchema:{type:"object", properties:{project:{type:"string"}, text:{type:"string"}}, required:["project","text"]},
        execute: async ({project, text}) => {
          const p = findProject(project); const name = p ? p.name : "General";
          const t = clip(text, max); if (!t) throw new Error("text is empty");
          await db.collection("logs").add({date:todayISO(), project:name, text:t, created:Date.now(), by:"golem"});
          did.push(`logged: ${name}`); return {date:todayISO(), project:name, text:t};
        } },
      { name:"move_project", description:"Moves a project card to a column: next, active, blocked, paused or shipped. Returns the new status.",
        inputSchema:{type:"object", properties:{name:{type:"string"}, status:{type:"string", enum:STATUSES}}, required:["name","status"]},
        execute: async ({name, status}) => {
          const p = findProject(name); if (!p) throw new Error("No project named " + name);
          if (!STATUSES.includes(status)) throw new Error("Unknown status " + status);
          await db.doc("projects/"+p._id).update({status, updated:todayISO()}); did.push(`moved: ${p.name} → ${STATUS_LABEL[status]}`); return {name:p.name, status};
        } },
      { name:"add_plan", description:"Adds a plan. horizon is next, later or someday. Returns the plan.",
        inputSchema:{type:"object", properties:{text:{type:"string"}, horizon:{type:"string", enum:["next","later","someday"]}}, required:["text"]},
        execute: async ({text, horizon}) => { const t = clip(text, 140); const h = ["next","later","someday"].includes(horizon)?horizon:"next";
          await db.collection("plans").add({text:t, horizon:h, done:false, fav:false}); did.push(`plan added`); return {text:t, horizon:h}; } },
      { name:"add_idea", description:"Adds an idea at the thought stage with an optional one-line pitch. Returns the idea.",
        inputSchema:{type:"object", properties:{title:{type:"string"}, pitch:{type:"string"}}, required:["title"]},
        execute: async ({title, pitch}) => { const t = clip(title, 80);
          await db.collection("ideas").add({title:t, pitch:clip(pitch||"",140), stage:"thought", updated:todayISO()}); did.push(`idea added`); return {title:t}; } }
    );
    return tools;
  }
  async function golemSend(q){
    q = String(q||"").trim(); if (!q || UI.golem.busy) return;
    const g = UI.golem; g.msgs.push({role:"user", content:q}); g.text = ""; const box = $("golem-in"); if (box) box.value = ""; g.busy = true; g.live = ""; g.status = "The Golem stirs…"; persistChat(); render(); scrollChat();
    const did = [];
    try {
      const sample = await window.claude?.use?.("sample");
      if (!sample){ g.msgs.push({role:"assistant", content:"I cannot speak in this view. Open the page signed in on claude.ai."}); return; }
      const st = settings();
      const intro = `You are Golem, the stone servant of the Pondering Orb, a homelab dashboard. Speak plainly with only a light touch of wizard flavour; be brief and concrete (a few sentences or a short list). Use the tools to read the dashboard before answering questions about it. ${st.golemWrites?`When the user says they did something or asks you to log it, call add_log with a short entry (at most ${logMax()} characters). Only write when asked or clearly told about finished work.`:"You are read-only: say so if asked to change anything."} Today is ${todayISO()}. Context: plans=${JSON.stringify(S.plans.filter(p=>!p.done).map(p=>p.text))}; next 14 days=${JSON.stringify(agendaBetween(todayISO(), isoOf(new Date(Date.now()+14*DAY))).map(i=>i.date+" "+i.title))}; apps=${JSON.stringify(allApps().map(a=>a.name))}.`;
      const history = g.msgs.slice(-12).map(m=>({role:m.role==="user"?"user":"assistant", content:m.content}));
      history[0] = history[0].role==="user" ? {role:"user", content:intro+"\n\n"+history[0].content} : history[0];
      if (history[0].role!=="user") history.unshift({role:"user", content:intro});
      const onText = ({text}) => { g.live = text; const el = $("golem-live"); if (el){ el.hidden = false; el.textContent = text; scrollChat(); } };
      let res;
      try { res = await sample(history, {modelTier:"default", cache:false, tools:golemTools(did), onText}); }
      catch(e){ if (e && e.code==="tools_unavailable") res = await sample(history.map((m,i)=>i===history.length-1?{...m, content:m.content+"\n\nDashboard data: "+JSON.stringify({projects:S.projects.map(p=>({name:p.name,status:p.status,next:p.next})), logs:logSorted().slice(0,30).map(l=>l.date+" "+l.project+": "+l.text), upkeep:S.upkeep.map(u=>({name:u.name, daysLeft:upkeepState(u).left}))})}:m), {modelTier:"default", cache:false, onText}); else throw e; }
      g.msgs.push({role:"assistant", content:(res && res.text || g.live || "…").trim(), did});
    } catch(e){
      g.msgs.push({role:"assistant", content: e && e.code==="rate_limited" ? "I must rest a moment. Try again in a minute." : e && e.code==="not_granted" ? "I was not allowed to speak on this page." : "Something cracked: " + (e && (e.message||e.code) || "unknown error"), did});
    } finally { g.busy = false; g.live = ""; g.status = ""; persistChat(); render(); scrollChat(); }
  }
  function scrollChat(){ const c = $("chat"); if (c) c.scrollTop = c.scrollHeight; }

  // ---------- drag and drop ----------
  document.addEventListener("dragstart", e => { const c = e.target.closest && e.target.closest("[data-card],[data-idea]"); if (!c) return; UI.dragId = c.dataset.card ? {coll:"projects", id:c.dataset.card} : {coll:"ideas", id:c.dataset.idea}; c.classList.add("dragging"); try { e.dataTransfer.setData("text/plain", UI.dragId.id); e.dataTransfer.effectAllowed = "move"; } catch {} });
  document.addEventListener("dragend", e => { document.querySelectorAll(".dragging,.drop").forEach(n=>n.classList.remove("dragging","drop")); });
  document.addEventListener("dragover", e => { const col = e.target.closest && e.target.closest(".kcol"); if (!col || !UI.dragId) return; e.preventDefault(); document.querySelectorAll(".drop").forEach(n=>n!==col&&n.classList.remove("drop")); col.classList.add("drop"); });
  document.addEventListener("drop", e => {
    const col = e.target.closest && e.target.closest(".kcol"); if (!col || !UI.dragId) return; e.preventDefault();
    const d = UI.dragId; UI.dragId = null; if (!need()) return;
    if (d.coll==="projects" && col.dataset.col){ const p = S.projects.find(x=>x._id===d.id); if (p && p.status!==col.dataset.col){ p.status = col.dataset.col; render(); db.doc("projects/"+d.id).update({status:col.dataset.col, updated:todayISO()}).catch(fail); } }
    if (d.coll==="ideas" && col.dataset.stage){ const i = S.ideas.find(x=>x._id===d.id); if (i && i.stage!==col.dataset.stage){ i.stage = col.dataset.stage; render(); db.doc("ideas/"+d.id).update({stage:col.dataset.stage, updated:todayISO()}).catch(fail); } }
  });
  document.addEventListener("input", e => { if (e.target.matches && e.target.matches("[data-counter]")){ const c = e.target.parentElement.querySelector(".counter"); if (c){ const n = e.target.value.length, m = Number(e.target.maxLength); c.textContent = n+"/"+m; c.classList.toggle("full", n>=m); } } });
  document.addEventListener("keydown", e => { if (e.target.id==="golem-in" && e.key==="Enter" && !e.shiftKey){ e.preventDefault(); golemSend(e.target.value); } });

  // ---------- the orb ----------
  (() => {
    const c = $("orb"), g = c.getContext("2d"), R = c.width/2;
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
    const wisps = Array.from({length:5}, (_,i)=>({a:i*1.26, r:.25+.12*(i%3), s:.0025+.0012*i, size:.38+.08*(i%2)}));
    let raf = 0;
    function frame(){
      const hi = css("--orb-hi"), mid = css("--orb-mid"), deep = css("--orb-deep");
      g.clearRect(0,0,c.width,c.height);
      g.save(); g.beginPath(); g.arc(R,R,R,0,Math.PI*2); g.clip();
      const base = g.createRadialGradient(R*.7,R*.65,R*.1,R,R,R); base.addColorStop(0,mid); base.addColorStop(1,deep);
      g.fillStyle = base; g.fillRect(0,0,c.width,c.height);
      g.globalCompositeOperation = "lighter";
      for (const w of wisps){
        if (!reduce) w.a += w.s;
        const x = R + Math.cos(w.a)*R*w.r, y = R + Math.sin(w.a*1.3)*R*w.r;
        const rg = g.createRadialGradient(x,y,0,x,y,R*w.size); rg.addColorStop(0,mid); rg.addColorStop(1,"rgba(0,0,0,0)");
        g.globalAlpha = .35; g.fillStyle = rg; g.fillRect(0,0,c.width,c.height);
      }
      g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
      const sh = g.createRadialGradient(R*.62,R*.55,0,R*.62,R*.55,R*.32); sh.addColorStop(0,hi); sh.addColorStop(1,"rgba(255,255,255,0)");
      g.globalAlpha = .7; g.fillStyle = sh; g.fillRect(0,0,c.width,c.height); g.globalAlpha = 1;
      g.restore();
      if (!reduce && !document.hidden) raf = requestAnimationFrame(frame); else raf = 0;
    }
    frame();
    document.addEventListener("visibilitychange", ()=>{ if (!document.hidden && !raf && !reduce) frame(); });
  })();
})();
</script>
